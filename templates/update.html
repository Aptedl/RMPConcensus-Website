{% extends 'base.html' %}

{% block head %} 
<title>Task Master</title><!--Name of website in tab -->
{% endblock %}

{% block body %} 
<div class = "content">
    <h1 style="text-align: center;"> Task Master</h1>

    <div class="form">
        <form action="/update/{{task.id}}" method="POST"><!--Send a Post request for the when the submission button on the index (main, or / screen) screen is hit-->
            <input type="text" name="content" id="content", value="{{task.content}}">
            <input type="submit" value="Add Task">
        </form>
    </div>
</div>
{% endblock %}
